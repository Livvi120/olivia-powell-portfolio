<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 490" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Orbiting green moon with botanical forms</title>
  <desc id="desc">A luminous glassy green orb floats inside fine orbital rings above a branching stem with leaves.</desc>
  <defs>
    <radialGradient id="orb" cx="34%" cy="27%" r="74%">
      <stop offset="0" stop-color="#e8f7d3" stop-opacity=".82"/>
      <stop offset=".27" stop-color="#b7d89a" stop-opacity=".72"/>
      <stop offset=".68" stop-color="#5d8b5e" stop-opacity=".65"/>
      <stop offset="1" stop-color="#183c27" stop-opacity=".88"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8edbb" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5f9166" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#b8dd9d" stop-opacity=".32"/>
      <stop offset="1" stop-color="#b8dd9d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
